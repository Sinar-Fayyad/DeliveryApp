<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeliveryApp — Courier Login</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <a class="back" href="/login">← Back</a>
    <main>
      <div class="brand">
        <div class="brand-icon">🏍️</div>
        <span class="brand-name">DeliveryApp</span>
      </div>

      <h1>Courier Login</h1>
      <p class="subtitle">Sign in to your delivery account</p>

      <div id="error-msg" class="error-msg"></div>

      <form id="courier-login-form" method="POST" action="/courrier/login" novalidate>
        <label>
          Phone Number
          <input id="phone" type="tel" name="phoneNumber" placeholder="+1 555 000 0000" autocomplete="tel" required />
        </label>
        <label>
          Password
          <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign In</button>
      </form>

      <div class="divider">or</div>

      <p class="form-footer">New courier? <a href="/courrier/register">Register here</a></p>
    </main>

    <script>
      const form = document.getElementById("courier-login-form");
      const errorMsg = document.getElementById("error-msg");

      form.addEventListener("submit", (e) => {
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value;
        if (!phone || !password) {
          e.preventDefault();
          errorMsg.textContent = "Please fill in all fields.";
        } else {
          errorMsg.textContent = "";
        }
      });

      form.querySelectorAll("input").forEach((input) => {
        input.addEventListener("input", () => { errorMsg.textContent = ""; });
      });
    </script>
  </body>
</html>
