<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeliveryApp — {{restaurantName}}</title>
    <link rel="stylesheet" href="/dashboard.css" />
  </head>

  <body>
    <nav>
      <a class="brand" href="/restaurant/dashboard">
        <div class="brand-icon">🍽️</div>
        <span class="brand-name">{{restaurantName}}</span>
      </a>

      <div class="nav-right">
        <form method="POST" action="/restaurant/logout">
          <button type="submit">Logout</button>
        </form>
      </div>
    </nav>

    <div class="container">
      <div class="page-header">
        <div>
          <h1>Manager <span>Dashboard</span></h1>
          <p>Manage orders, menu, and account</p>
        </div>
      </div>

      <!-- TABS -->
      <div class="card">
        <div class="dashboard-tabs">
          <button
            type="button"
            class="dashboard-tab active"
            onclick="switchTab('menu')"
            id="tab-btn-menu"
          >
            🍔 MENU
          </button>

          <button
            type="button"
            class="dashboard-tab"
            onclick="switchTab('orders')"
            id="tab-btn-orders"
          >
            📦 ORDERS
          </button>
        </div>

        <!-- MENU TAB -->
        <div id="tab-menu" class="dashboard-tab-content active">
          <div class="card" style="margin-top: 1rem;">
            <div class="card-header">
              <span class="card-title">Menu Items</span>
            </div>

            <ul class="item-list">
              {{menuItems}}
            </ul>
          </div>

          <div class="card" style="margin-top: 1.5rem;">
            <div class="card-header">
              <span class="card-title">Add Menu Item</span>
            </div>

            <form
              id="add-item-form"
              method="POST"
              action="/restaurant/menu/add"
              novalidate
            >
              <input
                id="item-name"
                type="text"
                name="name"
                placeholder="Item name"
                required
              />

              <input
                id="item-price"
                type="number"
                name="price"
                placeholder="Price ($)"
                step="0.01"
                min="0"
                required
              />

              <input
                id="item-desc"
                type="text"
                name="description"
                placeholder="Short description (optional)"
              />

              <button type="submit" class="btn-add">
                + Add Item
              </button>
            </form>
          </div>
        </div>

        <!-- ORDERS TAB -->
        <div id="tab-orders" class="dashboard-tab-content">
          <div class="card" style="margin-top: 1rem;">
            <div class="card-header">
              <span class="card-title">Restaurant Orders</span>
            </div>

            <ul class="item-list" id="orders-list">
              {{orders}}
            </ul>
          </div>
        </div>
      </div>
    </div>

    <script>
      function switchTab(tab) {
        document.querySelectorAll(".dashboard-tab").forEach((btn) => {
          btn.classList.remove("active");
        });

        document.querySelectorAll(".dashboard-tab-content").forEach((content) => {
          content.classList.remove("active");
        });

        document
          .getElementById(`tab-btn-${tab}`)
          .classList.add("active");

        document
          .getElementById(`tab-${tab}`)
          .classList.add("active");
      }
    </script>
  </body>
</html>
