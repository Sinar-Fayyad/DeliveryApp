<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeliveryApp — {{restaurantName}}</title>
    <link rel="stylesheet" href="/dashboard.css" />
  </head>

  <body>
    <nav>
      <a class="brand" href="/restaurant/dashboard">
        <div class="brand-icon">🍽️</div>
        <span class="brand-name">{{restaurantName}}</span>
      </a>

      <div class="nav-right">
        <form method="POST" action="/restaurant/logout">
          <button type="submit">Logout</button>
        </form>
      </div>
    </nav>

    <div class="container">
      <div class="page-header">
        <div>
          <h1>Manager <span>Dashboard</span></h1>
          <p>Manage orders, menu, and account</p>
        </div>
      </div>

      <!-- TABS -->
      <div class="card">
        <div class="dashboard-tabs">
          <button
            type="button"
            class="dashboard-tab active"
            onclick="switchTab('menu')"
            id="tab-btn-menu"
          >
            🍔 MENU
          </button>

          <button
            type="button"
            class="dashboard-tab"
            onclick="switchTab('orders')"
            id="tab-btn-orders"
          >
            📦 ORDERS
          </button>
        </div>

        <!-- MENU TAB -->
        <div id="tab-menu" class="dashboard-tab-content active">
          <div class="card" style="margin-top: 1rem;">
            <div class="card-header">
              <span class="card-title">Menu Items</span>

              <button
                type="button"
                class="btn-add"
                id="open-add-item-modal"
              >
                + Add Item
              </button>
            </div>

            <ul class="item-list">
              {{menuItems}}
            </ul>
          </div>

          <!-- ADD ITEM MODAL -->
          <div
            class="modal-backdrop"
            id="add-item-modal-backdrop"
            aria-hidden="true"
            style="display:none;"
          >
            <div
              class="modal"
              role="dialog"
              aria-modal="true"
              aria-labelledby="add-item-modal-title"
            >
              <div class="modal-header">
                <h2 class="modal-title" id="add-item-modal-title">Add Menu Item</h2>
                <button
                  type="button"
                  class="modal-close"
                  id="close-add-item-modal"
                  aria-label="Close"
                >
                  ✕
                </button>
              </div>

              <form
                id="add-item-form"
                method="POST"
                action="/restaurant/menu/add"
                novalidate
              >
                <input
                  id="item-name"
                  type="text"
                  name="name"
                  placeholder="Item name"
                  required
                />

                <input
                  id="item-price"
                  type="number"
                  name="price"
                  placeholder="Price ($)"
                  step="0.01"
                  min="0"
                  required
                />

                <input
                  id="item-desc"
                  type="text"
                  name="description"
                  placeholder="Short description (optional)"
                />

                <div class="modal-actions">
                  <button
                    type="button"
                    class="btn-outline"
                    id="cancel-add-item"
                  >
                    Cancel
                  </button>
                  <button type="submit" class="btn-add">+ Add Item</button>
                </div>
              </form>
            </div>
          </div>


        </div>

        <!-- ORDERS TAB -->
        <div id="tab-orders" class="dashboard-tab-content">
          <div class="card" style="margin-top: 1rem;">
            <div class="card-header">
              <span class="card-title">Restaurant Orders</span>
            </div>

            <ul class="item-list" id="orders-list">{{orders}}</ul>
          </div>
        </div>
      </div>
    </div>

    <script>
      function switchTab(tab) {
        document.querySelectorAll('.dashboard-tab').forEach((btn) => {
          btn.classList.remove('active');
        });

        document.querySelectorAll('.dashboard-tab-content').forEach((content) => {
          content.classList.remove('active');
        });

        document.getElementById(`tab-btn-${tab}`).classList.add('active');
        document.getElementById(`tab-${tab}`).classList.add('active');
      }

      // Add modal
      const backdrop = document.getElementById('add-item-modal-backdrop');
      const openBtn = document.getElementById('open-add-item-modal');
      const closeBtn = document.getElementById('close-add-item-modal');
      const cancelBtn = document.getElementById('cancel-add-item');

      function openAddModal() {
        if (!backdrop) return;
        backdrop.style.display = 'flex';
        backdrop.classList.add('active');
        backdrop.setAttribute('aria-hidden', 'false');
      }

      function closeAddModal() {
        if (!backdrop) return;
        backdrop.classList.remove('active');
        backdrop.setAttribute('aria-hidden', 'true');
        backdrop.style.display = 'none';
      }

      if (openBtn) openBtn.addEventListener('click', openAddModal);
      if (closeBtn) closeBtn.addEventListener('click', closeAddModal);
      if (cancelBtn) cancelBtn.addEventListener('click', closeAddModal);

      if (backdrop) {
        backdrop.addEventListener('click', (e) => {
          if (e.target === backdrop) closeAddModal();
        });
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeAddModal();
      });



    </script>
  </body>
</html>
