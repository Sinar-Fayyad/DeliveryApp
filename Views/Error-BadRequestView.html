<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>400 — Bad Request</title>
    <link rel="stylesheet" href="/error.css" />
  </head>
  <body data-code="400">
    <main>
      <div class="stack">
        <div class="error-code">400</div>
        <div class="badge">Bad Request</div>
        <h1>Invalid Request</h1>
        <p>The server couldn't process your request. Please check your input and try again.</p>
        <div class="actions">
          <a class="button" onclick="history.back(); return false;" href="#">Try Again</a>
          <a class="button secondary" href="/">Go Home</a>
        </div>
        <p class="small">If you think this is a mistake, contact support.</p>
      </div>
    </main>
  </body>
</html>
