<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>500 — Server Error</title>
    <link rel="stylesheet" href="/error.css" />
  </head>
  <body data-code="500">
    <main>
      <div class="stack">
        <div class="error-code">500</div>
        <div class="badge">Server Error</div>
        <h1>Something Went Wrong</h1>
        <p>An unexpected error occurred on our end. We're working on fixing it.</p>
        <div class="hint">
          Try refreshing the page or come back in a few minutes. Error code: <code>500</code>
        </div>
        <div class="actions">
          <a class="button" onclick="location.reload(); return false;" href="#">Refresh Page</a>
          <a class="button secondary" href="/">Go Home</a>
        </div>
      </div>
    </main>
  </body>
</html>
