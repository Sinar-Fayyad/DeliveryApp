<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeliveryApp — Welcome</title>
    <link rel="stylesheet" href="/welcome.css" />
  </head>

  <body>
    <main class="welcome">
      <div class="brand">
        <div class="brand-icon">📦</div>
        <span class="brand-name">DELIVERYAPP</span>
      </div>

      <h1>Welcome</h1>
      <p class="subtitle">Choose your role to continue</p>

      <div class="role-grid">
        <a class="role-card" href="/login">
          <span class="role-title">Customer</span>
          <span class="role-desc">Order from restaurants</span>
        </a>

        <a class="role-card" href="/restaurant/login">
          <span class="role-title">Restaurant</span>
          <span class="role-desc">Manage your menu & orders</span>
        </a>

        <a class="role-card" href="/courrier/login">
          <span class="role-title">Courier</span>
          <span class="role-desc">Deliver orders</span>
        </a>
      </div>
    </main>
  </body>
</html>
